spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_api
    username: ${DB_USERNAME}
    password: ${PASSWORD_BANCO}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"
    baseline-on-migrate: true
    baseline-version: 1

server:
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.ecommerce.api.controller