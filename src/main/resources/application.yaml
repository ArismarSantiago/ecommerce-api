spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_api
    username: ${DB_USERNAME}
    password: ${PASSWORD_BANCO}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true


server:
  error:
    include-message: always
    include-binding-errors: always


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.ecommerce.api.controller


